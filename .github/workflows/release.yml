name: Desktop releases

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/release.yml'
      - 'scripts/release/**'
      - 'requirements*.txt'
      - 'internal/sidecar/**'
      - 'go.mod'
      - 'go.sum'
      - 'wails.json'
      - 'build/darwin/**'

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Validate release version and ancestry
        id: version
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$EVENT" == push && "$REF_TYPE" == tag ]]; then
            git merge-base --is-ancestor "$GITHUB_SHA" origin/master
            RELEASE_TAG="$REF_NAME"
          else
            RELEASE_TAG="v$(python3 -c 'import json; print(json.load(open("wails.json"))["info"]["productVersion"])')-dev.$GITHUB_RUN_ID"
          fi
          python3 scripts/release/package.py stamp --tag "$RELEASE_TAG"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: darwin/arm64
            asset: darwin-arm64
            goflags: ''
          - runner: macos-15-intel
            platform: darwin/amd64
            asset: darwin-amd64
            goflags: ''
          - runner: windows-2025
            platform: windows/amd64
            asset: windows-amd64
            goflags: ''
          - runner: ubuntu-24.04
            platform: linux/amd64
            asset: linux-amd64
            goflags: '-tags=webkit2_41'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      GOFLAGS: ${{ matrix.goflags }}
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
      TARGET_PLATFORM: ${{ matrix.platform }}
      ASSET_PLATFORM: ${{ matrix.asset }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-release.txt
      - name: Install build tools and dependencies
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0
          npm --prefix frontend ci
          python -m pip install -r requirements-release.txt pytest
      - name: Test
        run: |
          npm --prefix frontend test
          npm --prefix frontend run build
          go test ./...
          python -m unittest discover -s scripts/release -p 'test_*.py'
          python -m pytest sidecar/tests -q
      - name: Stamp and build desktop application
        run: |
          python scripts/release/package.py stamp --tag "$RELEASE_TAG"
          wails build -s -m -skipbindings -platform "$TARGET_PLATFORM" -ldflags "-X main.AppVersion=$RELEASE_VERSION"
      - name: Freeze Python calculation engine
        run: python -m PyInstaller --noconfirm --clean --distpath build/engine --workpath build/pyinstaller scripts/release/engine.spec
      - name: Package and test the relocated distribution
        run: python scripts/release/package.py package --tag "$RELEASE_TAG" --platform "$ASSET_PLATFORM"
      - name: Record Python dependency versions
        run: python -m pip freeze > "build/release/assets/Solara-$RELEASE_VERSION-$ASSET_PLATFORM-dependencies.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Solara-${{ matrix.asset }}
          path: build/release/assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: assets
          pattern: Solara-*
          merge-multiple: true
      - name: Verify complete matrix and checksums
        shell: bash
        run: |
          test "$(find assets -name '*.sha256' | wc -l)" -eq 4
          cd assets
          sha256sum --check ./*.sha256
          cat ./*.sha256 > SHA256SUMS.txt
      - name: Publish verified assets together
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > release.json 2>/dev/null; then
            python3 -c 'import json; assert json.load(open("release.json"))["isDraft"], "Refusing to overwrite an already published release"'
          else
            flags=()
            if [[ "$PRERELEASE" == true ]]; then flags+=(--prerelease); fi
            gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes --title "Solara $RELEASE_TAG" "${flags[@]}"
          fi
          gh release upload "$RELEASE_TAG" assets/* --clobber
          if [[ "$PRERELEASE" == true ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
          fi
